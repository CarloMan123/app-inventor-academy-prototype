<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Interactive mid-fidelity MVP prototype of App Inventor Academy: 8 screens in English with a Spanish toggle.">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>App Inventor Academy Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Nunito+Sans:opsz,wght@6..12,400..800&display=swap">
<style>
/* Layout: a phone-sized app (the prototype) beside a slim facilitator column; on phones the app fills the screen. */
:root {
  /* outer page (theme-aware) */
  --page-bg: #E8ECF2;
  --page-fg: #14213D;
  --page-muted: #55627A;
  --page-card: #FBFCFD;
  --page-line: #D2D9E4;
  --page-accent: #3F7A1C;
  --page-good: #2F6B16;
  --page-warn: #9A5B00;
  --page-chip: #E3E8F0;
  /* the app's own identity (single light look, like the real product) */
  --navy: #0E2340;
  --navy-2: #1B3A66;
  --green: #3F7A1C;
  --green-soft: #E5F1DA;
  --amber: #F2A900;
  --amber-soft: #FFF3D1;
  --ink: #14213D;
  --muted: #55627A;
  --line: #DCE2EC;
  --surface: #FFFFFF;
  --app-bg: #F2F5F9;
  --lock: #7D889A;
  --danger: #B3261E;
  --linkedin: #0A66C2;
  --on-dark: #F4F7FB;
  --on-dark-muted: #C3CEDF;
  /* type */
  --display: "Bricolage Grotesque", "Trebuchet MS", Arial, sans-serif;
  --body: "Nunito Sans", "Segoe UI", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --page-bg: #0B1220; --page-fg: #E7ECF4; --page-muted: #9EABC0; --page-card: #121B2E;
    --page-line: #26334C; --page-accent: #86C65A; --page-good: #86C65A; --page-warn: #F2B544; --page-chip: #1C2840;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --page-bg: #0B1220; --page-fg: #E7ECF4; --page-muted: #9EABC0; --page-card: #121B2E;
  --page-line: #26334C; --page-accent: #86C65A; --page-good: #86C65A; --page-warn: #F2B544; --page-chip: #1C2840;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--page-bg);
  color: var(--page-fg);
  font-family: var(--body);
  font-size: 15px;
  line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 24px;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--amber); outline-offset: 2px; }

.stage {
  max-width: 1180px; margin: 0 auto;
  display: grid; grid-template-columns: minmax(0, 1fr) 400px; gap: 40px; align-items: start;
}
.side { display: flex; flex-direction: column; gap: 20px; min-width: 0; padding-top: 12px; }
.side h1 { font-family: var(--display); font-size: 34px; line-height: 1.1; margin: 0; font-weight: 800; text-wrap: balance; }
.side .kicker { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; font-weight: 800; color: var(--page-accent); margin: 0; }
.side p { margin: 0; color: var(--page-muted); max-width: 60ch; }
.side-card { background: var(--page-card); border: 1px solid var(--page-line); border-radius: 14px; padding: 18px 20px; display: flex; flex-direction: column; gap: 10px; }
.side-card h2 { font-family: var(--display); font-size: 18px; margin: 0; }
.side-card ol { margin: 0; padding-left: 20px; color: var(--page-muted); display: grid; gap: 6px; }
.side-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.btn-outline { background: transparent; border: 1.5px solid var(--page-line); color: var(--page-fg); border-radius: 999px; padding: 8px 16px; font-weight: 700; }
.btn-outline:hover { border-color: var(--page-accent); }
.rec { font-size: 13px; color: var(--page-muted); display: flex; align-items: center; gap: 8px; }
.rec i { width: 8px; height: 8px; border-radius: 50%; background: var(--page-muted); display: inline-block; flex: none; }
.rec.on i { background: var(--page-accent); }

/* ---------- device ---------- */
.device {
  width: 400px; height: min(840px, calc(100vh - 48px)); min-height: 640px;
  background: #0A1526; border-radius: 44px; padding: 12px;
  box-shadow: 0 30px 60px -30px rgba(10, 21, 38, .55);
  position: sticky; top: 24px;
}
.app {
  height: 100%; border-radius: 34px; overflow: hidden; position: relative;
  background: var(--app-bg); color: var(--ink); display: flex; flex-direction: column;
}
.appbar {
  background: var(--navy); color: var(--on-dark); display: flex; align-items: center; gap: 8px;
  padding: 14px 14px 12px; flex: none;
}
.appbar .title { flex: 1; min-width: 0; font-family: var(--display); font-weight: 700; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.icon-btn { background: transparent; border: 0; color: var(--on-dark); width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; flex: none; }
.icon-btn:hover { background: rgba(255,255,255,.1); }
.icon-btn[hidden] { display: none !important; }
.lang { display: flex; background: rgba(255,255,255,.12); border-radius: 999px; padding: 3px; flex: none; }
.lang button { border: 0; background: transparent; color: var(--on-dark-muted); font-weight: 800; font-size: 12px; padding: 5px 10px; border-radius: 999px; letter-spacing: .04em; }
.lang button[aria-pressed="true"] { background: var(--amber); color: var(--navy); }
.screen { flex: 1; overflow-y: auto; overscroll-behavior: contain; }
.pad { padding: 18px 18px 28px; display: flex; flex-direction: column; gap: 16px; }

/* ---------- app components ---------- */
.eyebrow { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; font-weight: 800; margin: 0; }
h2.h { font-family: var(--display); font-size: 24px; line-height: 1.15; margin: 0; font-weight: 800; text-wrap: balance; }
h3.h { font-family: var(--display); font-size: 17px; line-height: 1.25; margin: 0; font-weight: 700; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
p { margin: 0; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 8px; }
.cta {
  border: 0; background: var(--green); color: #fff; font-weight: 800; font-size: 16px;
  padding: 14px 18px; border-radius: 12px; width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px;
}
.cta:hover { background: #356A16; }
.cta[disabled] { background: #B9C3D1; color: #F4F6F9; cursor: not-allowed; }
.cta.secondary { background: var(--surface); color: var(--navy); border: 1.5px solid var(--line); }
.cta.secondary:hover { border-color: var(--navy); }
.cta.dark { background: var(--navy); }
.cta.dark:hover { background: var(--navy-2); }
.cta.linkedin { background: var(--linkedin); }
.cta.linkedin:hover { background: #08519A; }
.textlink { background: none; border: 0; color: inherit; text-decoration: underline; font-weight: 700; padding: 4px 0; }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 800; border-radius: 999px; padding: 4px 10px; }
.chip.amber { background: var(--amber-soft); color: #6E4A00; }
.chip.green { background: var(--green-soft); color: #2D5A12; }
.chip.lock { background: #E8ECF2; color: #4F5B6E; }
.bar { height: 10px; background: #DCE3EC; border-radius: 999px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--green); border-radius: 999px; transition: width .4s ease; }
.svg { width: 18px; height: 18px; flex: none; }

/* hero */
.hero { background: var(--navy); color: var(--on-dark); padding: 26px 20px 28px; display: flex; flex-direction: column; gap: 14px; }
.hero .eyebrow { color: var(--amber); }
.hero h2 { font-family: var(--display); font-size: 31px; line-height: 1.05; font-weight: 800; margin: 0; letter-spacing: -.01em; }
.hero h2 span { display: block; }
.hero h2 span:last-child { color: var(--amber); }
.hero p { color: var(--on-dark-muted); }
.hero .note { font-size: 13px; color: var(--on-dark-muted); text-align: center; }
.proof { display: flex; gap: 14px; align-items: center; }
.proof .big { font-family: var(--display); font-weight: 800; font-size: 36px; color: var(--green); line-height: 1; }
.feature { display: grid; grid-template-columns: 40px minmax(0,1fr); gap: 12px; align-items: start; }
.feature .ico { width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; background: var(--green-soft); color: var(--green); }

/* forms */
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-weight: 800; font-size: 14px; }
.field input, .field select, .field textarea {
  border: 1.5px solid var(--line); border-radius: 10px; padding: 11px 12px; background: var(--surface); color: var(--ink); width: 100%;
}
.field textarea { min-height: 110px; resize: vertical; }
.field input:focus, .field select:focus, .field textarea:focus { border-color: var(--navy-2); outline: none; box-shadow: 0 0 0 3px rgba(27,58,102,.18); }
.field.err input, .field.err select, .field.err textarea { border-color: var(--danger); }
.field .msg { font-size: 13px; color: var(--danger); font-weight: 700; }
.field .hint { font-size: 13px; color: var(--muted); }
.timebox { display: flex; justify-content: space-between; align-items: center; gap: 10px; background: var(--amber-soft); border-radius: 12px; padding: 10px 14px; }
.timebox strong { color: #6E4A00; display: flex; gap: 6px; align-items: center; }
.privacy { font-size: 12.5px; color: var(--muted); }

/* dashboard */
.greet { background: var(--navy-2); color: var(--on-dark); padding: 22px 18px; display: flex; flex-direction: column; gap: 4px; }
.greet h2 { font-family: var(--display); font-size: 26px; margin: 0; font-weight: 800; }
.greet p { color: var(--on-dark-muted); font-size: 14px; }
.next { background: var(--amber-soft); border: 1.5px solid #F2D27A; border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.next .eyebrow { color: #7A5200; }
.path { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.path li { display: grid; grid-template-columns: 28px minmax(0,1fr) auto; gap: 10px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
.path li:first-child { border-top: 0; }
.dot { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-size: 13px; font-weight: 800; border: 2px solid var(--line); color: var(--muted); background: var(--surface); }
.dot.done { background: var(--green); border-color: var(--green); color: #fff; }
.dot.now { border-color: var(--amber); color: #6E4A00; }
.dot.locked { color: var(--lock); }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 10px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 8px; text-align: center; }
.stat b { display: block; font-family: var(--display); font-size: 22px; font-variant-numeric: tabular-nums; }
.stat span { font-size: 12px; color: var(--muted); font-weight: 700; }

/* module */
.mod-head { background: var(--navy-2); color: var(--on-dark); padding: 22px 18px; display: flex; flex-direction: column; gap: 8px; }
.mod-head .eyebrow { color: var(--amber); }
.mod-head h2 { font-family: var(--display); font-size: 25px; margin: 0; line-height: 1.1; font-weight: 800; }
.mod-head p { color: var(--on-dark-muted); font-size: 14px; }
.step { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.step.is-done { border-color: #B7D79E; }
.step-head { display: grid; grid-template-columns: 30px minmax(0,1fr) 20px; gap: 12px; align-items: start; padding: 14px; width: 100%; background: none; border: 0; text-align: left; }
.step-head[disabled] { cursor: default; }
.step-meta { display: flex; gap: 10px; flex-wrap: wrap; font-size: 13px; color: var(--muted); margin-top: 4px; }
.step-meta span { display: inline-flex; gap: 4px; align-items: center; }
.step-body { padding: 0 14px 14px 56px; display: flex; flex-direction: column; gap: 10px; font-size: 14px; }
.step-body ol { margin: 0; padding-left: 18px; display: grid; gap: 4px; }
.result { color: #2D5A12; font-weight: 700; font-size: 13px; display: block; margin-top: 4px; }
.st-title { display: block; font-family: var(--display); font-size: 17px; line-height: 1.25; font-weight: 700; color: var(--ink); }
.choices { display: flex; flex-wrap: wrap; gap: 8px; }
.choice { border: 1.5px solid var(--line); background: var(--surface); border-radius: 999px; padding: 7px 14px; font-weight: 700; font-size: 14px; }
.choice[aria-pressed="true"] { border-color: var(--green); background: var(--green-soft); color: #2D5A12; }
.done-btn { align-self: flex-start; border: 1.5px solid var(--green); background: var(--surface); color: var(--green); border-radius: 10px; padding: 8px 14px; font-weight: 800; display: inline-flex; gap: 6px; align-items: center; }
.done-btn.on { background: var(--green); color: #fff; }

/* activity */
.mission { background: var(--amber); color: var(--navy); padding: 22px 18px; display: flex; flex-direction: column; gap: 8px; }
.mission h2 { font-family: var(--display); font-size: 27px; line-height: 1.05; margin: 0; font-weight: 800; }
.mission p { font-size: 14px; }
.ev-opt { display: grid; grid-template-columns: 40px minmax(0,1fr) 22px; gap: 12px; align-items: center; text-align: left; width: 100%; background: var(--surface); border: 1.5px solid var(--line); border-radius: 14px; padding: 12px 14px; }
.ev-opt[aria-pressed="true"] { border-color: var(--green); background: var(--green-soft); }
.ev-opt .ico { width: 40px; height: 40px; border-radius: 10px; background: var(--app-bg); display: grid; place-items: center; color: var(--navy-2); }
.radio { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; }
.ev-opt[aria-pressed="true"] .radio { border-color: var(--green); background: var(--green); color: #fff; }
.example { display: grid; grid-template-columns: 40px minmax(0,1fr); gap: 12px; }
.avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--navy-2); color: var(--on-dark); display: grid; place-items: center; font-weight: 800; font-size: 14px; }

/* evidence */
.steps-ind { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 6px; }
.steps-ind div { font-size: 12px; font-weight: 800; color: var(--muted); display: flex; flex-direction: column; gap: 6px; }
.steps-ind div i { height: 6px; border-radius: 999px; background: #DCE3EC; display: block; }
.steps-ind div.on { color: var(--ink); }
.steps-ind div.on i { background: var(--green); }
.drop { border: 2px dashed #B6C2D3; border-radius: 14px; padding: 18px; display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; background: var(--surface); }
.drop img { max-height: 160px; border-radius: 10px; object-fit: cover; }
.file-name { font-weight: 800; word-break: break-all; }
.verifying { display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 60px 20px; text-align: center; }
.spinner { width: 44px; height: 44px; border-radius: 50%; border: 4px solid #DCE3EC; border-top-color: var(--green); animation: spin 0.9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* certificate */
.verified { background: var(--green); color: #fff; padding: 14px 18px; display: flex; gap: 10px; align-items: center; }
.verified b { font-family: var(--display); font-size: 18px; }
.cert { background: var(--surface); border: 6px solid var(--navy); border-radius: 6px; padding: 18px 16px; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 6px; position: relative; }
.cert::after { content: ""; position: absolute; inset: 4px; border: 1px solid var(--amber); pointer-events: none; }
.cert .brand { font-family: var(--display); font-weight: 800; letter-spacing: .08em; font-size: 13px; color: var(--navy); }
.cert .level { font-size: 11px; letter-spacing: .14em; font-weight: 800; color: #8A5D00; text-transform: uppercase; }
.cert .name { font-family: var(--display); font-weight: 800; font-size: 26px; color: var(--navy); line-height: 1.1; }
.cert .comp { font-weight: 800; color: var(--navy); font-size: 15px; line-height: 1.35; }
.cert .meta { font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.seal { width: 56px; height: 56px; border-radius: 50%; background: var(--amber); color: var(--navy); display: grid; place-items: center; }

/* upgrade */
.module-row { display: grid; grid-template-columns: 28px minmax(0,1fr) auto; gap: 10px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
.module-row:first-of-type { border-top: 0; }
.module-row.locked .t { color: var(--lock); }
.plan { background: var(--surface); border: 1.5px solid var(--line); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.plan.featured { border-color: var(--amber); background: #FFFBEF; }
.plan .price { font-family: var(--display); font-size: 28px; font-weight: 800; line-height: 1; }
.plan .price small { font-size: 13px; font-family: var(--body); color: var(--muted); font-weight: 700; }
.plan ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; font-size: 14px; }
.plan li { display: grid; grid-template-columns: 18px minmax(0,1fr); gap: 8px; }
.plan li .svg { color: var(--green); margin-top: 2px; }

/* feedback */
.scale { display: grid; grid-template-columns: repeat(5, minmax(0,1fr)); gap: 6px; }
.scale button { border: 1.5px solid var(--line); background: var(--surface); border-radius: 10px; padding: 10px 0; font-weight: 800; }
.scale button[aria-pressed="true"] { border-color: var(--green); background: var(--green-soft); color: #2D5A12; }
.scale-labels { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }

/* overlays */
.sheet-wrap { position: absolute; inset: 0; background: rgba(10,21,38,.5); display: flex; align-items: flex-end; z-index: 20; }
.sheet { background: var(--surface); width: 100%; border-radius: 20px 20px 0 0; padding: 20px 18px calc(22px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 12px; max-height: 88%; overflow-y: auto; }
.post { background: var(--app-bg); border-radius: 12px; padding: 12px 14px; font-size: 14px; white-space: pre-wrap; }
.toast { position: absolute; left: 16px; right: 16px; bottom: 18px; background: var(--navy); color: var(--on-dark); border-radius: 12px; padding: 12px 14px; font-weight: 700; font-size: 14px; z-index: 30; box-shadow: 0 10px 30px -10px rgba(0,0,0,.4); }

/* ---------- facilitator results ---------- */
.results { max-width: 1180px; margin: 40px auto 0; display: flex; flex-direction: column; gap: 18px; }
.results h2 { font-family: var(--display); font-size: 26px; margin: 0; }
.results .lead { color: var(--page-muted); margin: 0; max-width: 70ch; }
.hyp-grid { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 14px; }
.hyp { background: var(--page-card); border: 1px solid var(--page-line); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.hyp .top { display: flex; justify-content: space-between; gap: 8px; align-items: center; }
.hyp .code { font-family: var(--display); font-weight: 800; font-size: 18px; }
.hyp .val { font-family: var(--display); font-weight: 800; font-size: 34px; line-height: 1; font-variant-numeric: tabular-nums; }
.hyp p { margin: 0; font-size: 13.5px; color: var(--page-muted); }
.pill { font-size: 12px; font-weight: 800; border-radius: 999px; padding: 3px 10px; background: var(--page-chip); color: var(--page-muted); white-space: nowrap; }
.pill.good { color: var(--page-good); }
.pill.warn { color: var(--page-warn); }
.table-wrap { overflow-x: auto; background: var(--page-card); border: 1px solid var(--page-line); border-radius: 14px; }
table { border-collapse: collapse; width: 100%; font-size: 13.5px; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--page-line); white-space: nowrap; }
th { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--page-muted); }
tr:last-child td { border-bottom: 0; }
.empty { padding: 24px; color: var(--page-muted); }

@media (max-width: 980px) {
  .stage { grid-template-columns: minmax(0, 1fr); justify-items: center; }
  .side { max-width: 560px; width: 100%; order: 2; }
  .device { order: 1; position: relative; top: 0; }
  .hyp-grid { grid-template-columns: repeat(2, minmax(0,1fr)); }
}
@media (max-width: 560px) {
  body { padding-left: 0; padding-right: 0; padding-block: 0; }
  .stage { gap: 24px; }
  .device { width: 100%; height: auto; min-height: 0; border-radius: 0; padding: 0; box-shadow: none; background: transparent; }
  .app { border-radius: 0; min-height: 100vh; overflow: visible; }
  .appbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); }
  .screen { overflow: visible; }

const KEY = "aia-prototype-v1";
const RANK = { welcome: 1, register: 2, dashboard: 3, module: 4, activity: 5, evidence: 6, certificate: 7, upgrade: 8, feedback: 9 };
const fresh = () => ({
  lang: "en", screen: "welcome", history: [],
  form: { name: "", email: "", country: "", level: "", area: "", password: "" }, errors: {},
  user: null, regStart: null,
  moduleStarted: false, steps: [false, false, false], openStep: 0, planChoice: null,
  evType: null, evStep: 1, ev: { fileName: "", preview: "", desc: "", grade: "", students: "", subject: "", date: "" }, evErrors: {},
  cert: null, fb: { q1: null, q2: null, q3: null, q4: "" }, fbSent: false, dashArrive: null,
  m: newMetrics(),
});
function newMetrics() {
  return {
    id: "s" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7),
    startedAt: new Date().toISOString(), lang: "en", device: window.innerWidth < 560 ? "phone" : "desktop",
    started: false, furthest: "welcome", path: [],
    registered: false, registerSeconds: null, dashboardActionSeconds: null,
    profile: null, stepsDone: 0, evidenceType: null, evidenceStarted: false, evidenceStep: 0, evidenceCompleted: false,
    certificateViewed: false, shareOpened: false, shareAsWritten: null, downloadClicked: false,
    upgradeViewed: false, educatorClicked: false, institutionalClicked: false,
    survey: null, updatedAt: null,
  };
}
let S = load() || fresh();
S.verifying = false;
function load() {
  try { const raw = localStorage.getItem(KEY); return raw ? Object.assign(fresh(), JSON.parse(raw)) : null; } catch { return null; }
}
function persist() {
  try { const copy = { ...S, ev: { ...S.ev, preview: "" } }; localStorage.setItem(KEY, JSON.stringify(copy)); } catch {}
}
const L = () => STR[S.lang];
const fmt = (s, v = {}) => String(s).replace(/\{(\w+)\}/g, (_, k) => v[k] ?? "");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const firstName = () => (S.user?.name || "").trim().split(/\s+/)[0] || "";
const stepsDone = () => S.steps.filter(Boolean).length;
const progressPct = () => Math.round(stepsDone() * 20 + (S.cert ? 40 : 0));

/* ================= anonymous metrics (db) ================= */
let db = null, saveTimer = null, recording = false;
function track(patch) {
  Object.assign(S.m, patch);
  if (!S.m.started) return;
  S.m.updatedAt = new Date().toISOString();
  clearTimeout(saveTimer);
  saveTimer = setTimeout(flush, 700);
}
function flush() {
  if (!db || !S.m.started) return;
  db.collection("sessions").doc(S.m.id).set(JSON.parse(JSON.stringify(S.m))).catch(() => {});
}
function visit(screen) {
  const m = S.m;
  if (RANK[screen] > RANK[m.furthest]) m.furthest = screen;
  if (m.path[m.path.length - 1] !== screen && m.path.length < 80) m.path.push(screen);
  track({});
}

/* ================= navigation ================= */
const $ = sel => document.querySelector(sel);
const screenEl = $("#screen");
function go(screen, { replace = false } = {}) {
  if (!replace && S.screen !== screen) S.history.push(S.screen);
  S.screen = screen;
  if (screen === "dashboard" && S.dashArrive == null) S.dashArrive = Date.now();
  if (screen === "register" && !S.regStart) S.regStart = Date.now();
  if (screen === "certificate") track({ certificateViewed: true });
  if (screen === "upgrade") track({ upgradeViewed: true });
  visit(screen);
  render(true);
}
function back() {
  const prev = S.history.pop();
  if (prev) { S.screen = prev; render(true); }
}

/* ================= overlays ================= */
function toast(msg) {
  const el = $("#toast");

  clearTimeout(toast.t); toast.t = setTimeout(() => { el.hidden = true; }, 2600);
}

/* ================= certificate download (PNG) ================= */
function wrap(ctx, text, x, y, maxW, lh) {
  const words = text.split(" "); let line = "";
  for (const w of words) {
    const test = line ? line + " " + w : w;
    if (ctx.measureText(test).width > maxW && line) { ctx.fillText(line, x, y); line = w; y += lh; } else line = test;
  }
  if (line) ctx.fillText(line, x, y);
  return y + lh;
}
async function downloadCert() {
  track({ downloadClicked: true });
  const t = L(), c = certData();
  const W = 1600, H = 1130, cv = document.createElement("canvas");
  cv.width = W; cv.height = H;
  const x = cv.getContext("2d");
  try { await document.fonts.ready; } catch {}
  x.fillStyle = "#FFFFFF"; x.fillRect(0, 0, W, H);
  x.strokeStyle = "#0E2340"; x.lineWidth = 28; x.strokeRect(14, 14, W - 28, H - 28);
  x.strokeStyle = "#F2A900"; x.lineWidth = 3; x.strokeRect(50, 50, W - 100, H - 100);
  x.textAlign = "center"; x.fillStyle = "#0E2340";
  x.font = '800 40px "Bricolage Grotesque", Arial'; x.fillText(t.c_brand, W / 2, 170);
  x.fillStyle = "#8A5D00"; x.font = '800 26px "Nunito Sans", Arial'; x.fillText(t.c_level.toUpperCase(), W / 2, 220);
  x.fillStyle = "#55627A"; x.font = '400 30px "Nunito Sans", Arial'; x.fillText(t.c_certifies, W / 2, 320);
  x.fillStyle = "#0E2340"; x.font = '800 76px "Bricolage Grotesque", Arial'; x.fillText(c.name, W / 2, 410);
  x.fillStyle = "#55627A"; x.font = '400 28px "Nunito Sans", Arial'; x.fillText(c.profile, W / 2, 465);
  x.fillText(t.c_demo, W / 2, 560);
  x.fillStyle = "#0E2340"; x.font = '800 36px "Nunito Sans", Arial';
  let y = wrap(x, t.c_comp, W / 2, 625, 1200, 50);
  x.fillStyle = "#2D5A12"; x.font = '700 26px "Nunito Sans", Arial'; y = wrap(x, c.evidence, W / 2, y + 40, 1250, 36);
  x.fillStyle = "#55627A"; x.font = '400 24px "Nunito Sans", Arial'; x.fillText(fmt(t.c_meta, { date: c.date, id: c.id }), W / 2, H - 120);
  const blob = await new Promise(r => cv.toBlob(r, "image/png"));
  if (!blob) { toast(t.dl_no); return; }
  await saveFile(`AIA-certificate-${c.id || "demo"}.png`, blob, t.dl_ok);
}
// Inside Claude the viewer's downloads capability saves the file; on a plain website a blob link does.
async function saveFile(filename, data, okMsg) {
  const t = L();
  if (window.claude?.use) {
    let dl = null;
    try { dl = await window.claude.use("downloads"); } catch {}
    if (!dl) { toast(t.dl_no); return; }
    try { const r = await dl.save({ filename, data }); if (r?.status === "saved" && okMsg) toast(okMsg); }
    catch (err) { if (err?.code === "unavailable") toast(t.dl_no); }
    return;
  }
  const blob = data instanceof Blob ? data : new Blob([data], { type: "text/csv;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
  if (okMsg) toast(okMsg);
}

/* ================= events ================= */
document.addEventListener("click", ev => {
  const lang = ev.target.closest("[data-lang]");
  if (lang) { S.lang = lang.dataset.lang; track({ lang: S.lang }); render(); renderResults(); return; }
  if (ev.target.closest("#backBtn")) { back(); return; }
  if (ev.target.closest("#restartBtn")) { restart(); return; }
  if (ev.target.closest("#exportCsv")) { exportCsv(); return; }
  const g = ev.target.closest("[data-go]");
  if (g && !g.disabled) { go(g.dataset.go); return; }
  const a = ev.target.closest("[data-act]");
  if (!a || a.disabled) return;
  const act = a.dataset.act;
  if (act === "closeSheet" && a.classList.contains("sheet-wrap") && ev.target !== a) return;
  const t = L();
  switch (act) {
    case "start":
      if (!S.m.started) { S.m.started = true; track({}); }
      go(S.user ? "dashboard" : "register"); break;
    case "nextStep": {
      if (S.m.dashboardActionSeconds == null && S.dashArrive) track({ dashboardActionSeconds: Math.round((Date.now() - S.dashArrive) / 1000) });
      go(nextStep()[1]); break;
    }
    case "startModule": S.moduleStarted = true; S.openStep = S.steps.findIndex(x => !x); if (S.openStep < 0) S.openStep = 0; render(); break;
    case "toggleStep": { const i = +a.dataset.i; S.openStep = S.openStep === i ? -1 : i; render(); break; }
    case "plan": S.planChoice = +a.dataset.j; render(); break;
    case "markStep": {
      const i = +a.dataset.i; S.steps[i] = !S.steps[i];
      if (S.steps[i]) { const nx = S.steps.findIndex(x => !x); S.openStep = nx; }
      track({ stepsDone: stepsDone() }); render(); break;
    }
    case "evType": S.evType = +a.dataset.i; track({ evidenceType: ["photo", "screenshot", "video"][S.evType] }); render(); break;
    case "toEvidence": track({ evidenceStarted: true, evidenceStep: Math.max(S.m.evidenceStep, 1) }); go("evidence"); break;
    case "evNext": evNext(); break;
    case "evPrev": S.evStep = Math.max(1, S.evStep - 1); S.evErrors = {}; render(true); break;
    case "share": openShare(); break;
    case "asWritten": track({ shareAsWritten: a.dataset.v }); a.parentElement.querySelectorAll(".choice").forEach(b => b.setAttribute("aria-pressed", b === a)); break;
    case "copyPost": {
      const text = sharePost();
      const done = () => toast(t.sh_copied);
      const fail = () => { const r = document.createRange(); r.selectNodeContents($("#postText")); const s = getSelection(); s.removeAllRanges(); s.addRange(r); toast(t.sh_copy_fail); };
      try { navigator.clipboard.writeText(text).then(done, fail); } catch { fail(); }
      break;
    }
    case "closeSheet": closeSheet(); break;
    case "download": downloadCert(); break;
    case "plan1": openPlan(1); break;
    case "plan2": openPlan(2); break;
    case "fb": { const q = a.dataset.q; S.fb[q] = +a.dataset.v; render(); break; }
    case "sendFb": {
      const fb = S.fb;
      track({ survey: { useInClass: ["yes", "maybe", "no"][fb.q1], evidenceEase: fb.q2, wouldPay: ["pay", "institution", "not_now"][fb.q3], comment: (fb.q4 || "").slice(0, 600) } });
      flush(); S.fbSent = true; render(true); break;
    }
    case "restart": restart(); break;
  }
});

document.addEventListener("input", ev => {
  const el = ev.target;
  if (el.dataset.field) {
    S.form[el.dataset.field] = el.value;
    if (S.errors[el.dataset.field]) { delete S.errors[el.dataset.field]; el.closest(".field").classList.remove("err"); el.closest(".field").querySelector(".msg")?.remove(); }
    const c = $("#regCount"); if (c) c.textContent = fmt(L().r_count, { n: filled() });
    persist();
  }
  if (el.dataset.ev) {
    S.ev[el.dataset.ev] = el.value;
    if (el.dataset.ev === "desc") { const h = $("#descHint"); if (h) h.textContent = fmt(L().v2_hint, { n: Math.min(el.value.trim().length, 30) }); }
    persist();
  }
  if (el.dataset.fb) { S.fb[el.dataset.fb] = el.value; persist(); }
});
document.addEventListener("change", ev => {
  if (ev.target.id === "v-file") {
    const file = ev.target.files?.[0]; if (!file) return;
    S.ev.fileName = file.name; S.ev.preview = ""; delete S.evErrors.file;
    if (file.type.startsWith("image/") && file.size < 15e6) {
      const r = new FileReader();
      r.onload = () => { S.ev.preview = String(r.result); render(); };
      r.readAsDataURL(file);
    }
    render();
  }
});
document.addEventListener("submit", ev => {
  if (ev.target.id !== "regForm") return;
  ev.preventDefault();
  const t = L(), f = S.form, e = {};
  if (!f.name.trim()) e.name = t.e_name;
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(f.email.trim())) e.email = t.e_email;
  ["country", "level", "area"].forEach(k => { if (f[k] === "") e[k] = t.e_select; });
  if (f.password.length < 8) e.password = t.e_pass;
  S.errors = e;
  if (Object.keys(e).length) { render(); $(".field.err input, .field.err select")?.focus(); return; }
  const secs = Math.round((Date.now() - (S.regStart || Date.now())) / 1000);
  S.user = { name: f.name.trim(), country: +f.country, level: +f.level, area: +f.area };
  S.form = { ...S.form, password: "" };
  track({ registered: true, registerSeconds: secs, profile: { country: STR.en.countries[+f.country], level: STR.en.levels[+f.level], area: STR.en.areas[+f.area] } });
  S.history = ["welcome"];
  go("dashboard", { replace: true });
});

function evNext() {
  const t = L(), ev = S.ev, e = {};
  if (S.evStep === 1 && !ev.fileName) e.file = t.e_file;
  if (S.evStep === 2 && ev.desc.trim().length < 30) e.desc = t.e_desc;
  if (S.evStep === 3) {
    if (!ev.grade.trim()) e.grade = t.e_grade;
    if (!(+ev.students > 0)) e.students = t.e_students;
    if (!ev.date) e.date = t.e_date;
  }
  S.evErrors = e;
  if (Object.keys(e).length) { render(); return; }
  if (S.evStep < 3) { S.evStep++; track({ evidenceStep: Math.max(S.m.evidenceStep, S.evStep) }); render(true); return; }
  S.verifying = true; render(true);
  setTimeout(() => {
    S.verifying = false;
    S.cert = { id: "AIA-M1-" + Math.floor(100000 + Math.random() * 900000), issued: Date.now() };
    track({ evidenceCompleted: true, evidenceStep: 3 });
    S.history = ["welcome", "dashboard"];
    go("certificate", { replace: true });
  }, 1600);
}

function restart() {
  flush();
  const lang = S.lang;
  S = fresh(); S.lang = lang; S.m.lang = lang;
  closeSheet(); render(true);
}

/* ================= facilitator results ================= */
let sessions = [], isEditor = false;
const pct = (a, b) => b ? Math.round(a / b * 100) : null;
function hypRows() {
  const st = sessions.filter(s => s.started);
  const reg = st.filter(s => s.registered);
  const dash = st.filter(s => RANK[s.furthest] >= 3);
  const q1 = st.filter(s => s.survey?.useInClass);
  const evS = st.filter(s => s.evidenceStarted);
  const share = st.filter(s => s.shareAsWritten);
  const up = st.filter(s => s.upgradeViewed);
  return [
    [pct(reg.filter(s => s.registerSeconds != null && s.registerSeconds < 180).length, reg.length), reg.length, 80],
    [pct(dash.filter(s => s.dashboardActionSeconds != null && s.dashboardActionSeconds <= 60).length, dash.length), dash.length, null],
    [pct(q1.filter(s => s.survey.useInClass === "yes").length, q1.length), q1.length, 70],
    [pct(evS.filter(s => s.evidenceCompleted).length, evS.length), evS.length, 75],
    [pct(share.filter(s => s.shareAsWritten === "yes").length, share.length), share.length, 60],
    [pct(up.filter(s => s.educatorClicked || s.institutionalClicked).length, up.length), up.length, 40],
  ];
}
function renderResults() {
  const box = $("#results");
  if (!isEditor) { box.hidden = true; return; }
  box.hidden = false;
  const t = L(), rows = hypRows(), st = sessions.filter(s => s.started).sort((a, b) => String(b.startedAt).localeCompare(String(a.startedAt)));
  const yn = v => v === true ? t.yes : v === false ? t.no : "—";
  box.innerHTML = `
    <div class="side-row" style="justify-content:space-between">
      <div><h2>${t.res_title}</h2><p class="lead">${t.res_lead}</p></div>
      <div class="side-row"><span class="pill">${fmt(t.res_n, { n: st.length })}</span><button class="btn-outline" id="exportCsv" type="button">${t.res_export}</button></div>
    </div>
    <div class="hyp-grid">
      ${t.hyp.map((h, i) => {
        const [v, n, target] = rows[i];
        const state = n < 3 || v == null ? "wait" : target == null ? "wait" : v > target ? "ok" : "low";
        const pill = target == null && n >= 3 ? "" : `<span class="pill ${state === "ok" ? "good" : state === "low" ? "warn" : ""}">${state === "ok" ? t.pill_ok : state === "low" ? t.pill_low : t.pill_wait}</span>`;
        return `<div class="hyp"><div class="top"><span class="code">${h[0]}</span>${pill}</div>
          <span class="val">${v == null ? "—" : v + "%"}</span>
          <p><b>${h[1]}</b> · n = ${n}</p><p>${h[2]}</p></div>`;
      }).join("")}
    </div>
    <div class="table-wrap">
      ${st.length ? `<table>
        <thead><tr>${t.cols.map(c => `<th>${c}</th>`).join("")}</tr></thead>
        <tbody>${st.map(s => `<tr>
          <td>${esc(new Date(s.startedAt).toLocaleString(S.lang === "es" ? "es-MX" : "en-US", { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" }))}</td>
          <td>${esc((s.lang || "").toUpperCase())}</td>
          <td>${esc(STR[S.lang].screens[s.furthest] || s.furthest)}</td>
          <td>${s.registerSeconds ?? "—"}</td>
          <td>${s.dashboardActionSeconds ?? "—"}</td>
          <td>${s.stepsDone ?? 0}/3</td>
          <td>${s.evidenceCompleted ? t.yes : s.evidenceStarted ? `${t.no} (${s.evidenceStep}/3)` : "—"}</td>
          <td>${s.shareAsWritten === "yes" ? t.yes : s.shareAsWritten === "no" ? t.no : "—"}</td>
          <td>${s.educatorClicked ? "Educator" : s.institutionalClicked ? "Inst." : s.upgradeViewed ? t.no : "—"}</td>
          <td>${esc(s.survey?.useInClass ?? "—")}</td>
          <td>${s.survey?.evidenceEase ?? "—"}</td>
          <td>${esc(s.survey?.wouldPay ?? "—")}</td>
          <td style="white-space:normal;min-width:220px">${esc(s.survey?.comment || "")}</td>
        </tr>`).join("")}</tbody></table>` : `<p class="empty">${t.res_none}</p>`}
    </div>`;
}
async function exportCsv() {
  const head = ["startedAt", "lang", "device", "furthest", "registerSeconds", "dashboardActionSeconds", "stepsDone", "evidenceType", "evidenceStarted", "evidenceStep", "evidenceCompleted", "shareOpened", "shareAsWritten", "downloadClicked", "upgradeViewed", "educatorClicked", "institutionalClicked", "useInClass", "evidenceEase", "wouldPay", "comment", "country", "level", "area"];
  const cell = v => { const s = v == null ? "" : String(v); return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
  const lines = [head.join(",")].concat(sessions.filter(s => s.started).map(s => [
    s.startedAt, s.lang, s.device, s.furthest, s.registerSeconds, s.dashboardActionSeconds, s.stepsDone, s.evidenceType, s.evidenceStarted, s.evidenceStep, s.evidenceCompleted,
    s.shareOpened, s.shareAsWritten, s.downloadClicked, s.upgradeViewed, s.educatorClicked, s.institutionalClicked,
    s.survey?.useInClass, s.survey?.evidenceEase, s.survey?.wouldPay, s.survey?.comment, s.profile?.country, s.profile?.level, s.profile?.area,
  ].map(cell).join(",")));
  await saveFile("aia-validation-sessions.csv", lines.join("\n"));
}

/* ================= boot ================= */
render();
(async () => {
  if (!window.claude?.use) return;
  try { db = await window.claude.use("db"); } catch { db = null; }
  recording = !!db;
  renderSide();
  if (S.m.started) flush();
  let user = null;
  try { user = await window.claude.use("user"); } catch {}
  try { isEditor = user ? await user.canEdit() : false; } catch { isEditor = false; }
  if (isEditor && db) {
    db.collection("sessions").onSnapshot(snap => {
      sessions = snap.docs.map(d => d.data()).filter(Boolean);
      renderResults();
    }, () => {});
  }
  renderResults();
})();
})();
</script>
